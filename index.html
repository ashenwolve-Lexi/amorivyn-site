<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Amorivyn — 18+ AI roleplay stories. Create characters and explore imaginative conversations. For adults 18 and over.">
  <title>Amorivyn — 18+ AI Roleplay Stories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #100a18;
      --bg-soft: #1a1226;
      --gold: #d4af77;
      --gold-soft: #e8d5b0;
      --text: #f4eef8;
      --muted: #b9adc6;
      --line: rgba(212, 175, 119, 0.28);
      --card: rgba(255, 255, 255, 0.03);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at top, #2a163f 0%, var(--bg) 55%),
        var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .wrap {
      width: min(680px, calc(100% - 2.5rem));
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 3.5rem 0 2.5rem;
    }

    header {
      text-align: center;
    }

    .mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.4rem;
      border: 1px solid var(--gold);
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: var(--gold);
      font-size: 1.85rem;
      letter-spacing: 0;
      box-shadow: 0 0 0 6px rgba(212, 175, 119, 0.07), 0 18px 40px rgba(0, 0, 0, 0.35);
      background: linear-gradient(180deg, #2b1a3c, #16101f);
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.6rem, 8vw, 4rem);
      letter-spacing: 0.04em;
      line-height: 1.05;
      color: var(--gold-soft);
    }

    .tagline {
      margin-top: 0.7rem;
      color: var(--muted);
      font-size: 1.08rem;
      letter-spacing: 0.04em;
    }

    .rule {
      width: 64px;
      height: 1px;
      background: var(--gold);
      margin: 1.6rem auto;
      opacity: 0.7;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 1.6rem 1.5rem 1.7rem;
      text-align: center;
    }

    p {
      color: var(--muted);
      font-size: 1.02rem;
    }

    .notice {
      display: inline-block;
      margin-top: 1.15rem;
      padding: 0.35rem 0.8rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--gold-soft);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .cta {
      display: inline-block;
      margin-top: 1.6rem;
      background: var(--gold);
      color: #1a1208;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 0.85rem 1.45rem;
      border-radius: 999px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      box-shadow: 0 10px 24px rgba(212, 175, 119, 0.22);
    }

    .cta:hover,
    .cta:focus-visible {
      background: #e3c38a;
      transform: translateY(-1px);
      outline: none;
    }

    footer {
      margin-top: 2rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    footer a {
      color: var(--gold-soft);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    footer a:hover,
    footer a:focus-visible {
      border-bottom-color: var(--gold);
      outline: none;
    }

    .sep {
      margin: 0 0.55rem;
      color: rgba(185, 173, 198, 0.5);
    }

    .age {
      margin-top: 1.15rem;
      font-size: 0.9rem;
      color: #9d90ab;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="mark" aria-hidden="true">☽</div>
      <h1>Amorivyn</h1>
      <p class="tagline">18+ AI roleplay stories</p>
      <div class="rule" aria-hidden="true"></div>
    </header>

    <section class="card">
      <p>Create characters and explore imaginative conversations, group stories, and adventures. For adults 18 and over.</p>
      <div class="notice">18+</div>
      <p>
        <a class="cta" href="https://play.google.com/store/apps/details?id=com.amorivyn.roleplay">Get it on Google Play</a>
      </p>
    </section>

    <footer>
      <a href="privacy.html">Privacy Policy</a>
      <span class="sep" aria-hidden="true">·</span>
      <a href="mailto:Amorivyn@gmail.com">Amorivyn@gmail.com</a>
      <p class="age">This app is intended only for adults aged 18 and over.</p>
    </footer>
  </main>
</body>
</html>
